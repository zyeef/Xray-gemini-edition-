plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '1.1.0'
group = 'com.example.xray'

base {
    archivesName = 'xrayhelper'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.81'

    parchment {
        mappingsVersion = '2024.07.28'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
        }
    }

    mods {
        xrayhelper {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}
